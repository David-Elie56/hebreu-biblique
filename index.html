<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אלף־בית · Hébreu Biblique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d2b28;
  --ink2:#123832;
  --ink3:#1a4038;
  --gold:#b8935a;
  --gold-light:#d9bb85;
  --gold-dim:#8a6f42;
  --parchment:#f6efd9;
  --parchment2:#eee0bd;
  --paper:#fbf6e9;
  --text:#2a221a;
  --text-soft:#5a4f3f;
  --red:#8a3324;
  --green:#3f6b4f;
  --shadow: 0 10px 30px rgba(13,43,40,.15);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--parchment);
  background-image:
    radial-gradient(ellipse at top left, rgba(184,147,90,.08), transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(13,43,40,.06), transparent 55%);
  color:var(--text);
  font-family:'Source Serif 4', serif;
  min-height:100vh;
}
.heb{
  font-family:'Frank Ruhl Libre', serif;
  direction:rtl;
  unicode-bidi:isolate;
  font-feature-settings:"liga" 1;
  font-size:1.85em;
  line-height:1.5;
  cursor:pointer;
}
.heb:hover{ text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--gold-dim); text-underline-offset:4px; }
.heb.playing{ color:var(--gold-dim); }
.niqqud{ color:#017a74; } /* voyelles (niqqud) — vert canard */
.affix{ color:#b5401e; font-weight:600; } /* ajout grammatical : préfixe/suffixe/changement interne */
.affix.niqqud{ color:#b5401e; } /* une voyelle qui fait partie de l'ajout reste dans la couleur de l'ajout */
.heb-static{
  font-family:'Frank Ruhl Libre', serif;
  direction:rtl;
  unicode-bidi:isolate;
  font-feature-settings:"liga" 1;
  font-size:1.85em;
  line-height:1.5;
}
h1,h2,h3,h4{
  font-family:'Frank Ruhl Libre', serif;
  color:var(--ink);
  margin:0 0 .4em 0;
  letter-spacing:.01em;
}
.ui{font-family:'Inter', sans-serif;}
a{color:inherit;}
button{font-family:'Inter', sans-serif; cursor:pointer;}

/* ---------- layout shell ---------- */
#shell{
  display:grid;
  grid-template-columns:250px 1fr;
  min-height:100vh;
}
.sidebar{
  background:linear-gradient(180deg, var(--ink) 0%, var(--ink2) 100%);
  color:var(--parchment2);
  padding:28px 18px 24px;
  position:relative;
  overflow:hidden;
}
.sidebar::before{
  content:"א";
  position:absolute;
  font-family:'Frank Ruhl Libre',serif;
  font-size:340px;
  font-weight:900;
  color:rgba(255,255,255,.035);
  top:-60px; left:-70px;
  line-height:1;
  pointer-events:none;
}
.brand{
  display:flex;align-items:center;gap:12px;
  margin-bottom:26px;
  position:relative;
}
.brand .mark{
  width:42px;height:42px;border-radius:50%;
  border:1.5px solid var(--gold-light);
  display:flex;align-items:center;justify-content:center;
  font-family:'Frank Ruhl Libre',serif;
  font-size:20px;color:var(--gold-light);
  flex:none;
}
.brand .name{font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-family:'Inter',sans-serif;font-weight:600;color:var(--parchment);}
.brand .sub{font-size:11px;color:var(--gold-light);opacity:.8;}

.navgroup{margin-bottom:22px;position:relative;}
.navgroup .label{
  font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold-light);opacity:.75;
  margin:0 0 8px 4px;
}
.navitem{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:9px;
  font-size:14.5px;color:var(--parchment2);
  cursor:pointer;border:1px solid transparent;
  transition:background .15s, border-color .15s;
  margin-bottom:2px;
}
.navitem .num{
  font-family:'Frank Ruhl Libre',serif;font-size:13px;color:var(--gold-light);
  width:20px;text-align:center;flex:none;
}
.navitem:hover{background:rgba(255,255,255,.06);}
.navitem.active{background:rgba(184,147,90,.18);border-color:rgba(217,187,133,.35);color:#fff;}
.navitem .prog{
  margin-left:auto;font-family:'Inter',sans-serif;font-size:10px;color:var(--gold-light);opacity:.8;
}

.tabbar{display:none;}

main{
  padding:34px 44px 70px;
  max-width:980px;
}
.topline{
  display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;margin-bottom:26px;
  gap:16px;flex-wrap:wrap;
}
.topline .eyebrow{
  font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold-dim);margin-bottom:4px;
}
.topline h1{font-size:30px;margin:0;}
.streakbadge{
  font-family:'Inter',sans-serif;font-size:12px;color:var(--text-soft);
  display:flex;gap:14px;align-items:center;
}
.streakbadge b{color:var(--ink);}

.card{
  background:var(--paper);
  border:1px solid var(--parchment2);
  border-radius:var(--radius);
  padding:22px 26px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
  position:relative;
}
.card h3{font-size:19px;margin-bottom:.55em;color:var(--ink2);}
.card h3 .en{font-family:'Inter',sans-serif;font-size:11px;color:var(--gold-dim);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px;}
.card h3 .en.en-heb{font-family:'Frank Ruhl Libre',serif;font-size:20px;letter-spacing:0;text-transform:none;direction:rtl;unicode-bidi:isolate;display:block;margin-bottom:3px;}
.card p{line-height:1.65;color:var(--text);margin:0 0 12px;}
.card p:last-child{margin-bottom:0;}
.rule{
  background:var(--parchment);
  border-left:3px solid var(--gold);
  padding:10px 16px;border-radius:0 8px 8px 0;
  margin:12px 0;font-size:15px;line-height:1.6;
}
.example{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:rgba(184,147,90,.08);
  border:1px dashed var(--gold-dim);
  border-radius:10px;
  padding:10px 16px;margin:8px 0;
}
.example .heb{font-size:40px;color:var(--ink2);}
.example .fr{font-family:'Inter',sans-serif;font-size:13px;color:var(--text-soft);}
.example .tr{font-family:'Inter',sans-serif;font-size:12px;color:var(--gold-dim);font-style:italic;}

table.gridtbl{
  width:100%;border-collapse:collapse;margin:14px 0;font-size:24px;
}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px 0;}
.tblwrap table.gridtbl{margin:0;}
table.gridtbl th{
  font-family:'Inter',sans-serif;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;
  background:var(--ink2);color:var(--parchment);
  padding:10px 12px;text-align:left;
}
table.gridtbl td{
  padding:11px 12px;border-bottom:1px solid var(--parchment2);
  vertical-align:middle;
}
table.gridtbl td.h{color:var(--ink2);}
table.gridtbl tr:nth-child(even) td{background:rgba(184,147,90,.06);}
table.gridtbl caption{caption-side:top;text-align:left;font-family:'Inter',sans-serif;font-size:12px;color:var(--gold-dim);letter-spacing:.06em;text-transform:uppercase;padding-bottom:6px;}

.callout{
  border-radius:10px;padding:12px 16px;margin:12px 0;font-size:14.5px;line-height:1.55;
  display:flex;gap:10px;align-items:flex-start;
}
.callout.warn{background:#fbeae5;border:1px solid #e3b6a8;color:#6b2c1c;}
.callout.info{background:#eaf1ee;border:1px solid #b9d3c4;color:#22493a;}
.callout .ico{font-size:16px;flex:none;}

.lesson-nav{
  display:flex;justify-content:space-between;margin-top:26px;gap:10px;
}
.navbtn{
  font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
  background:var(--ink);color:var(--parchment);border:none;border-radius:9px;
  padding:10px 16px;display:flex;align-items:center;gap:8px;
  transition:background .15s;
}
.navbtn:hover{background:var(--ink3);}
.navbtn:disabled{opacity:.35;cursor:default;}

/* ---------- vocab ---------- */
.vocab-toolbar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;
}
.vocab-toolbar input[type=text]{
  font-family:'Inter',sans-serif;padding:9px 13px;border-radius:9px;border:1px solid var(--parchment2);
  background:var(--paper);min-width:220px;font-size:14px;
}
.vocab-toolbar select{
  font-family:'Inter',sans-serif;padding:9px 13px;border-radius:9px;border:1px solid var(--parchment2);
  background:var(--paper);font-size:14px;
}
.vocab-toolbar button.chip{
  font-family:'Inter',sans-serif;font-size:12.5px;padding:8px 14px;border-radius:20px;
  border:1px solid var(--gold-dim);background:transparent;color:var(--ink2);
}
.vocab-toolbar button.chip.active{background:var(--ink2);color:var(--parchment);}
.vocab-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;
}
.vcard{
  background:var(--paper);border:1px solid var(--parchment2);border-radius:12px;
  padding:16px;cursor:pointer;box-shadow:var(--shadow);
  min-height:130px;display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .12s;
}
.vcard:hover{transform:translateY(-2px);}
.vcard .front .heb{font-size:50px;color:var(--ink2);display:block;}
.vcard .front .tr{font-family:'Inter',sans-serif;font-size:12px;color:var(--gold-dim);font-style:italic;}
.vcard .back{font-family:'Inter',sans-serif;font-size:14px;color:var(--text);display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--parchment2);}
.vcard.flipped .back{display:block;}
.vcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.vcard .tag{font-family:'Inter',sans-serif;font-size:10px;color:var(--gold-dim);background:rgba(184,147,90,.12);padding:2px 8px;border-radius:20px;}
.vcard .mark{display:flex;gap:6px;}
.vcard .mark button{border:none;background:none;font-size:15px;opacity:.35;padding:2px;}
.vcard .mark button.on{opacity:1;}

/* ---------- exercises ---------- */
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:10px;}
.extile{
  background:var(--paper);border:1px solid var(--parchment2);border-radius:12px;padding:18px;
  box-shadow:var(--shadow);cursor:pointer;
}
.extile h4{font-size:16px;margin-bottom:6px;}
.extile p{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--text-soft);margin:0 0 10px;}
.extile .go{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--ink2);}
.extile .score{font-family:'Inter',sans-serif;font-size:11px;color:var(--gold-dim);}

.qbox{
  background:var(--paper);border:1px solid var(--parchment2);border-radius:14px;
  padding:28px;box-shadow:var(--shadow);
}
.qbox .qprompt{text-align:center;padding:20px 0 26px;}
.qbox .qprompt .heb{font-size:64px;color:var(--ink2);display:block;margin-bottom:6px;}
.qbox .qprompt .fr{font-family:'Inter',sans-serif;font-size:16px;color:var(--text-soft);}
.optiongrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto;}
.optbtn{
  font-family:'Inter',sans-serif;font-size:14.5px;padding:13px 16px;border-radius:10px;
  border:1.5px solid var(--parchment2);background:var(--parchment);text-align:left;
}
.optbtn:hover{border-color:var(--gold-dim);}
.optbtn.correct{background:#e2f0e6;border-color:var(--green);color:#1f4a30;}
.optbtn.wrong{background:#fbe4de;border-color:var(--red);color:#6b2416;}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text-soft);}
.progressbar{height:6px;background:var(--parchment2);border-radius:6px;overflow:hidden;margin-bottom:22px;}
.progressbar div{height:100%;background:var(--gold);transition:width .2s;}

.flash{
  background:var(--paper);border:1px solid var(--parchment2);border-radius:14px;padding:34px;
  box-shadow:var(--shadow);text-align:center;
}
.flash .side{min-height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;}
.flash .heb{font-size:42px;color:var(--ink2);}
.flash .fr{font-family:'Inter',sans-serif;font-size:17px;color:var(--text);}
.flash .hint{font-family:'Inter',sans-serif;font-size:12px;color:var(--gold-dim);margin-top:4px;}
.flash .rule-remind{font-family:'Inter',sans-serif;font-size:13px;color:var(--text-soft);background:var(--parchment);border-radius:8px;padding:10px 14px;margin-top:14px;text-align:left;}

/* ---------- conjugation drill (blank / reveal) ---------- */
.conjug-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
.conjug-head .root{font-size:1.3em;}
.conjug-head .meaning{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--gold-dim);text-transform:uppercase;letter-spacing:.06em;}
.blank-cell{
  display:inline-block;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;
  color:var(--gold-dim);border:1px dashed var(--gold-dim);border-radius:6px;
  padding:4px 12px;transition:background .12s;
}
.blank-cell:hover{background:rgba(184,147,90,.1);}
.blank-cell.revealed{
  border:none;color:var(--ink2);font-family:'Frank Ruhl Libre',serif;
  padding:0;cursor:default;background:none;
}
.conjug-toolbar{display:flex;gap:10px;margin:10px 0 16px;flex-wrap:wrap;}

/* ---------- historique / évolution ---------- */
.histrow{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--parchment2);}
.histrow:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.histhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:8px;flex-wrap:wrap;}
.histhead b{font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);}
.spark{display:flex;align-items:flex-end;gap:3px;height:36px;min-width:80px;}
.sparkbar{width:7px;background:var(--gold-dim);border-radius:2px 2px 0 0;opacity:.85;}
.histtable{width:100%;border-collapse:collapse;font-family:'Inter',sans-serif;font-size:12.5px;color:var(--text-soft);}
.histtable td{padding:3px 8px 3px 0;white-space:nowrap;}

/* ---------- code couleur genre / nombre (tableaux Féminin/Masculin) ---------- */
.heb.gn-fs{ color:#d6336c; } /* féminin singulier — rose fort */
.heb.gn-fp{ color:#a61e4d; font-weight:700; } /* féminin pluriel — rose fort + gras */
.heb.gn-ms{ color:#1c7ea8; } /* masculin singulier — bleu ciel foncé */
.heb.gn-mp{ color:#145d80; font-weight:700; } /* masculin pluriel — bleu ciel foncé + gras */
.gn-legend{display:flex;gap:14px;flex-wrap:wrap;font-family:'Inter',sans-serif;font-size:12px;color:var(--text-soft);margin:6px 0 14px;}
.gn-legend span{display:inline-flex;align-items:center;gap:6px;}
.gn-legend i{width:14px;height:14px;border-radius:4px;display:inline-block;}

/* ---------- clavier virtuel hébreu ---------- */
.hebkeyboard{background:var(--parchment);border:1px solid var(--parchment2);border-radius:10px;padding:10px;margin:8px 0 14px;}
.hebkb-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px;}
.hebkb-row:last-child{margin-bottom:0;}
.hebkbtn{
  min-width:32px;height:32px;padding:0 6px;border-radius:6px;border:1px solid var(--parchment2);
  background:var(--paper);cursor:pointer;font-size:16px!important;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;transition:background .1s;
}
.hebkbtn:hover{background:rgba(184,147,90,.15);}
.hebkb-wide{min-width:70px;font-family:'Inter',sans-serif;font-size:12px!important;padding:0 10px;}
.hebkb-niqqud .hebkbtn{font-size:18px!important;}

/* ---------- traçage des lettres (canvas + pointer events) ---------- */
.hwcanvaswrap{position:relative;width:300px;height:300px;margin:10px auto;border:2px dashed var(--parchment2);border-radius:12px;background:var(--paper);touch-action:none;}
.hwguide{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Frank Ruhl Libre',serif;font-size:220px;color:rgba(28,43,40,.12);
  pointer-events:none;user-select:none;line-height:1;
}
#hwCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;}

/* ---------- audio playback button (Web Speech API) ---------- */
.playbtn{
  background:var(--parchment2,#f0e9dc);border:1px solid var(--gold-dim);border-radius:999px;
  width:34px;height:34px;font-size:15px;cursor:pointer;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;transition:transform .1s, background .12s;
}
.playbtn:hover{background:rgba(184,147,90,.18);}
.playbtn:active{transform:scale(0.92);}
.playbtn.playing{background:var(--gold-dim);animation:playpulse 0.8s infinite;}
@keyframes playpulse{0%,100%{box-shadow:0 0 0 0 rgba(184,147,90,.5);}50%{box-shadow:0 0 0 6px rgba(184,147,90,0);}}
.flashbtns{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap;}
.flashbtns button{
  font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;border-radius:9px;padding:10px 18px;border:none;
}
.btn-reveal{background:var(--ink2);color:var(--parchment);}
.btn-good{background:#3f6b4f;color:#fff;}
.btn-bad{background:#8a3324;color:#fff;}
.btn-ghost{background:transparent;border:1px solid var(--parchment2)!important;color:var(--text-soft);}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:8px;}
.statbox{background:var(--parchment);border-radius:10px;padding:14px;text-align:center;}
.statbox b{display:block;font-family:'Frank Ruhl Libre',serif;font-size:32px;color:var(--ink2);}
.statbox span{font-family:'Inter',sans-serif;font-size:11px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.05em;}

.backlink{font-family:'Inter',sans-serif;font-size:13px;color:var(--gold-dim);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;}
.backlink:hover{color:var(--ink2);}

.userbox{padding:0 4px 16px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12);}
.userbox .uname{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--parchment);}
.userbox .urole{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--gold-light);text-transform:uppercase;letter-spacing:.08em;}

.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--parchment);
  background-image:radial-gradient(ellipse at top left, rgba(184,147,90,.1), transparent 55%), radial-gradient(ellipse at bottom right, rgba(13,43,40,.08), transparent 55%);}
.logincard{background:var(--paper);border:1px solid var(--parchment2);border-radius:16px;box-shadow:var(--shadow);
  padding:40px 40px 32px;max-width:380px;width:92%;text-align:center;}
.logincard .mark{width:60px;height:60px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-family:'Frank Ruhl Libre',serif;font-size:28px;color:var(--ink2);margin:0 auto 14px;}
.logincard h1{font-size:22px;margin-bottom:4px;}
.logincard .sub{font-family:'Inter',sans-serif;font-size:12px;color:var(--text-soft);margin-bottom:24px;}
.logincard input{width:100%;font-family:'Inter',sans-serif;padding:12px 14px;border-radius:9px;border:1px solid var(--parchment2);
  background:var(--parchment);margin-bottom:10px;font-size:14px;}
.logincard button{width:100%;background:var(--ink2);color:var(--parchment);border:none;border-radius:9px;padding:12px;
  font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;margin-top:6px;}
.logincard .err{color:var(--red);font-family:'Inter',sans-serif;font-size:12.5px;min-height:18px;margin-top:8px;}
.logincard .hint{font-family:'Inter',sans-serif;font-size:11px;color:var(--gold-dim);margin-top:16px;line-height:1.5;}

.acctform{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.acctform input, .acctform select{font-family:'Inter',sans-serif;padding:10px 12px;border-radius:8px;border:1px solid var(--parchment2);background:var(--parchment);font-size:13.5px;flex:1 1 160px;}

::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{background:var(--parchment2);border-radius:10px;}

@media (max-width:860px){
  #shell{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .tabbar{
    display:flex;position:sticky;top:0;z-index:20;
    background:var(--ink);overflow-x:auto;

<script>
/* =========================================================================

const LESSON_TITLES = [

const BASE_LESSON_COUNT = LESSON_TITLES.length; // nombre de cours "d'origine", avant les cours ajoutés par l'admin

function tableHTML(caption, headers, rows, hebColIndexes){
  hebColIndexes = hebColIndexes || [];

  if(caption) h += '<caption>'+caption+'</caption>';
  h += '<thead><tr>' + headers.map(x=>'<th>'+x+'</th>').join('') + '</tr></thead><tbody>';
  rows.forEach(r=>{
    h += '<tr>' + r.map((c,i)=>{
      if(!hebColIndexes.includes(i)) return '<td>'+c+'</td>';
      if(c === '—' || c === '' ) return '<td class="h">'+c+'</td>';
      const already = typeof c === 'string' && /^\s*<span[\s>]/.test(c);
      return '<td class="h">' + (already ? c : '<span class="heb">'+c+'</span>') + '</td>';
    }).join('') + '</tr>';
  });

}

function ex(heb, fr, tr){

/* ---- Blank / reveal cells for conjugation drills ---- */
function bc(heb){
  if(!heb) return '';

}
function revealCell(el){

}
function revealAllIn(id){

}
function conjugTableHTML(caption, headers, rows, blankColIndexes){
  let h = '<div class="tblwrap"><table class="gridtbl">';
  if(caption) h += '<caption>'+caption+'</caption>';
  h += '<thead><tr>' + headers.map(x=>'<th>'+x+'</th>').join('') + '</tr></thead><tbody>';

  });

}

/* ---- COURS 1 : Alphabet ---- */
const alphabetRows = [
 ["Alef","א","—","Muet","1","Bœuf"],
 ["Beth","בּ","—","B","2","Maison"],
 ["Veth","ב","—","V","''","''"],
 ["Guimel","גּ","—","G","3","Chameau"],
 ["Daleth","ד","—","D","4","Porte"],
 ["Hé","ה","—","H","5","Fenêtre, souffle"],
 ["Vav","ו","—","V / W","6","Clou, crochet"],
 ["Zayin","ז","—","Z","7","Poignard, hache"],
 ["Heth","ח","—","H guttural","8","Clôture"],
 ["Teth","ט","—","T","9","Bouclier"],
 ["Yod","י","—","Y","10","Main"],
 ["Kaf","כּ","ךּ","K","20","Main (paume)"],
 ["Khaf","כ","ך","J espagnol","''","''"],
 ["Lamed","ל","—","L","30","Aiguillon, bâton"],
 ["Mem","מ","ם","M","40","Eau"],
 ["Noun","נ","ן","N","50","Poisson, serpent"],
 ["Samekh","ס","—","S","60","Pilier, soutien"],
 ["Ayin","ע","—","Muet","70","Œil, source"],
 ["Pé","פּ","ףּ","P","80","Bouche"],
 ["Fé","פ","ף","F","''","''"],
 ["Tsadé","צ","ץ","Ts","90","Chasser, hameçon"],
 ["Qof","ק","—","Q","100","Singe, massue"],
 ["Resh","ר","—","R roulé","200","Tête"],
 ["Shin","שׁ","—","Sh","300","Dent"],
 ["Sin","שׂ","—","S","''","''"],
 ["Tav","תּ","—","Th / T (think)","400","Signe, croix"]
];

/* ---- Synthèse vocale (Web Speech API) — noms hébreux vocalisés des lettres ---- */
const ALPHABET_NAMES_HEB = {
  "Alef":"אָלֶף", "Beth":"בֵּית", "Veth":"בֵית", "Guimel":"גִּימֶל", "Daleth":"דָּלֶת", "Hé":"הֵא",
  "Vav":"וָו", "Zayin":"זַיִן", "Heth":"חֵית", "Teth":"טֵית", "Yod":"יוֹד", "Kaf":"כַּף", "Khaf":"כַף",
  "Lamed":"לָמֶד", "Mem":"מֵם", "Noun":"נוּן", "Samekh":"סָמֶךְ", "Ayin":"עַיִן", "Pé":"פֵּא", "Fé":"פֵא",
  "Tsadé":"צָדֵי", "Qof":"קוֹף", "Resh":"רֵישׁ", "Shin":"שִׁין", "Sin":"שִׂין", "Tav":"תָּו"
};
let HEB_VOICE = null;
function loadHebVoice(){
  try{
    const voices = window.speechSynthesis.getVoices();
    HEB_VOICE = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('he')) || null;
  }catch(e){}
}
if(typeof window!=='undefined' && 'speechSynthesis' in window){
  loadHebVoice();
  window.speechSynthesis.onvoiceschanged = loadHebVoice;
}
function sanitizeHebForSpeech(text){
  return text
    .replace(/[\u05BE]/g, ' ')      // maqqef (תיבה מחוברת) -> espace, ne se prononce pas
    .replace(/[\u05C0\u05C3\u05C6]/g, '') // paseq / sof pasuq / nun hafoukha -> supprimés (ponctuation, pas phonétique)
    .replace(/\s+/g, ' ')
    .trim();
}
function speakHeb(text, btn){
  try{
    if(!('speechSynthesis' in window)){ alert("La synthèse vocale n'est pas disponible sur ce navigateur."); return; }
    window.speechSynthesis.cancel();
    const clean = sanitizeHebForSpeech(text);
    if(!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'he-IL';
    u.rate = 0.8;
    if(HEB_VOICE) u.voice = HEB_VOICE;
    if(btn){ btn.classList.add('playing'); u.onend = ()=>btn.classList.remove('playing'); u.onerror = ()=>btn.classList.remove('playing'); }
    window.speechSynthesis.speak(u);
  }catch(e){ console.error(e); }
}
function playBtnHTML(hebText){
  return `<button class="playbtn" onclick="playHebSound('${hebText}', this)" title="Écouter la prononciation" aria-label="Écouter">🔊</button>`;
}
function playHebSound(key, btn){
  const recording = AUDIO_OVERRIDES[key];
  if(recording){ playRecordedAudio(recording, btn); }
  else{ speakHeb(TEXT_OVERRIDES[key] || key, btn); }
}

/* =========================================================================
   CLAVIER VIRTUEL HÉBREU (pour les champs de saisie des enseignants/admin)
   ========================================================================= */
const HEB_KB_LETTERS = ['א','ב','ג','ד','ה','ו','ז','ח','ט','י','כ','ך','ל','מ','ם','נ','ן','ס','ע','פ','ף','צ','ץ','ק','ר','ש','ת'];
const HEB_KB_NIQQUD = [
  {ch:'\u05B0',label:'שְׁ'},{ch:'\u05B1',label:'חֱ'},{ch:'\u05B2',label:'חֲ'},{ch:'\u05B3',label:'חֳ'},
  {ch:'\u05B4',label:'חִ'},{ch:'\u05B5',label:'חֵ'},{ch:'\u05B6',label:'חֶ'},{ch:'\u05B7',label:'חַ'},
  {ch:'\u05B8',label:'חָ'},{ch:'\u05B9',label:'חֹ'},{ch:'\u05BB',label:'חֻ'},{ch:'\u05BC',label:'חּ'},
  {ch:'\u05C1',label:'שׁ'},{ch:'\u05C2',label:'שׂ'},{ch:'\u05BE',label:'־'}
];
function hebKeyboardHTML(targetId){
  const letterBtns = HEB_KB_LETTERS.map(l=>`<button type="button" class="hebkbtn heb" onclick="hebKbInsert('${targetId}','${l}')">${l}</button>`).join('');
  const niqqudBtns = HEB_KB_NIQQUD.map(n=>`<button type="button" class="hebkbtn heb" onclick="hebKbInsert('${targetId}','${n.ch}')" title="${n.label}">${n.label}</button>`).join('');
  return `<div class="hebkeyboard">
    <div class="hebkb-row">${letterBtns}</div>
    <div class="hebkb-row hebkb-niqqud">${niqqudBtns}</div>
    <div class="hebkb-row"><button type="button" class="hebkbtn hebkb-wide" onclick="hebKbInsert('${targetId}',' ')">Espace</button><button type="button" class="hebkbtn hebkb-wide" onclick="hebKbBackspace('${targetId}')">⌫ Effacer</button></div>
  </div>`;
}
function hebKbInsert(targetId, ch){
  const el = document.getElementById(targetId);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  el.value = el.value.slice(0,start) + ch + el.value.slice(end);
  const pos = start + ch.length;
  el.focus();
  if(el.setSelectionRange) el.setSelectionRange(pos,pos);
}
function hebKbBackspace(targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  if(start===end && start>0){
    el.value = el.value.slice(0,start-1) + el.value.slice(end);
    el.focus(); if(el.setSelectionRange) el.setSelectionRange(start-1,start-1);
  }else if(start!==end){
    el.value = el.value.slice(0,start) + el.value.slice(end);
    el.focus(); if(el.setSelectionRange) el.setSelectionRange(start,start);
  }
}

/* =========================================================================
   COLORATION : voyelles (niqqud) + additions grammaticales (préfixe/suffixe/
   changement interne) dans les tableaux de conjugaison/déclinaison
   ========================================================================= */
function isVowelPoint(ch){
  const cp = ch.codePointAt(0);
  return (cp>=0x05B0 && cp<=0x05BB) || cp===0x05C7; // sheva…qoubouts, qamats qatan (daguesh/rafé/shin-sin dot exclus : pas des voyelles)
}
function isHebrewLetter(ch){
  const cp = ch.codePointAt(0);
  return cp>=0x05D0 && cp<=0x05EA; // lettres consonnes (alef..tav)
}
const FINAL_LETTER_MAP = {'\u05DA':'\u05DB','\u05DD':'\u05DE','\u05DF':'\u05E0','\u05E3':'\u05E4','\u05E5':'\u05E6'};
function normLetter(ch){ return FINAL_LETTER_MAP[ch] || ch; } // ך/ם/ן/ף/ץ = même lettre que כ/מ/נ/פ/צ
function renderHebSpan(text, mask){
  const chars = Array.from(text);
  let html = '';
  for(let i=0;i<chars.length;i++){
    const ch = chars[i];
    const classes = [];
    if(isVowelPoint(ch)) classes.push('niqqud');
    if(mask && mask[i]) classes.push('affix');
    html += classes.length ? '<span class="'+classes.join(' ')+'">'+ch+'</span>' : ch;
  }
  return html;
}
/* Distance d'édition pondérée : substituer/supprimer une VRAIE LETTRE (consonne
   racine) coûte cher — pour forcer l'algorithme à toujours réaligner les
   consonnes identiques plutôt que de les traiter comme « changées » à cause
   d'une ambiguïté de voyelles environnantes. Les signes diacritiques (voyelles,
   daguesh, points) restent bon marché à substituer entre eux. Insérer un
   caractère (l'ajout recherché : préfixe/suffixe) reste toujours bon marché.
   Renvoie, pour `form`, un masque des caractères qui diffèrent de `root`. */
function subCost(ca, cb){ return (!isHebrewLetter(ca) && !isHebrewLetter(cb)) ? 1 : 4; }
function delCost(ca){ return isHebrewLetter(ca) ? 4 : 1; }
function insCost(cb){ return 1; }
function diffMask(root, form){
  const a = Array.from(root), b = Array.from(form);
  const n = a.length, m = b.length;
  const dp = Array.from({length:n+1}, ()=>new Array(m+1).fill(0));
  for(let i=0;i<=n;i++) dp[i][0] = i*4;
  for(let j=0;j<=m;j++) dp[0][j] = j;
  for(let i=1;i<=n;i++) dp[i][0] = dp[i-1][0] + delCost(a[i-1]);
  for(let i=1;i<=n;i++){
    for(let j=1;j<=m;j++){
      if(normLetter(a[i-1])===normLetter(b[j-1])){ dp[i][j] = dp[i-1][j-1]; continue; }
      dp[i][j] = Math.min(
        dp[i-1][j-1] + subCost(a[i-1], b[j-1]),
        dp[i-1][j] + delCost(a[i-1]),
        dp[i][j-1] + insCost(b[j-1])
      );
    }
  }
  let i=n, j=m;
  const mask = new Array(m).fill(false);
  while(i>0 || j>0){
    if(i>0 && j>0 && normLetter(a[i-1])===normLetter(b[j-1]) && dp[i][j]===dp[i-1][j-1]){ i--; j--; }
    else if(i>0 && j>0 && dp[i][j]===dp[i-1][j-1] + subCost(a[i-1],b[j-1])){ mask[j-1]=true; i--; j--; }
    else if(j>0 && dp[i][j]===dp[i][j-1] + insCost(b[j-1])){ mask[j-1]=true; j--; }
    else if(i>0 && dp[i][j]===dp[i-1][j] + delCost(a[i-1])){ i--; }
    else { if(j>0){ mask[j-1]=true; j--; } else i--; }
  }
  return mask;
}
/* Repère les tableaux « Féminin / Masculin » à 6 lignes (Qatal/Yiqtol : 1-2-3 sg,
   1-2-3 pl) ou 2 lignes (Participe/Impératif : Singulier/Pluriel), prend la
   3ᵉ pers. masc. sing. (ou masc. singulier) comme forme de référence, et
   colore dans chaque autre case ce qui diffère de cette référence. Puis
   colore les voyelles de tout le texte hébreu restant de la zone donnée. */
function diffMaskMultiForm(refText, raw){
  // Certaines cellules contiennent plusieurs formes alternatives séparées par « / » :
  // on les compare chacune séparément à la référence, pour ne pas fausser l'alignement.
  if(raw.indexOf(' / ') === -1) return diffMask(refText, raw);
  const parts = raw.split(' / ');
  let mask = [];
  parts.forEach((part, idx)=>{
    if(idx>0) mask.push(false, false, false); // « / » et espaces : jamais colorés
    mask = mask.concat(diffMask(refText, part));
  });
  return mask;
}
function applyColorOverride(el, raw){
  const color = COLOR_OVERRIDES[raw];
  if(color) el.style.color = color;
}
function escapeNoteHTML(text){
  const esc = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc.replace(/([\u0591-\u05F4]+)/g, '<span class="heb">$1</span>');
}
function enhanceHebrewText(scopeEl){
  scopeEl = scopeEl || document;
  const processed = new Set();
  scopeEl.querySelectorAll('table.gridtbl').forEach(table=>{
    const ths = Array.from(table.querySelectorAll('thead th')).map(th=>th.textContent.trim());
    if(ths.length<2 || ths[ths.length-2]!=='Féminin' || ths[ths.length-1]!=='Masculin') return;
    const trs = Array.from(table.querySelectorAll('tbody tr'));
    let refRowIdx;
    if(trs.length===6) refRowIdx=2; else if(trs.length===2) refRowIdx=0; else return;
    const refTds = trs[refRowIdx].querySelectorAll('td');
    if(refTds.length<2) return;
    const refHebEl = refTds[refTds.length-1].querySelector('.heb');
    let refText = refHebEl ? refHebEl.textContent.trim() : '';
    if(refText) refText = TEXT_OVERRIDES[refText] || refText;
    trs.forEach((tr, ri)=>{
      const tds = tr.querySelectorAll('td');
      if(tds.length<2) return;
      const isPlural = (trs.length===6) ? (ri>=3) : (ri===1);
      const fem = tds[tds.length-2], masc = tds[tds.length-1];
      const femHeb = fem.querySelector('.heb');
      const mascHeb = masc.querySelector('.heb');
      if(femHeb) femHeb.classList.add(isPlural ? 'gn-fp' : 'gn-fs');
      if(mascHeb) mascHeb.classList.add(isPlural ? 'gn-mp' : 'gn-ms');
      if(!refText) return; // référence pas encore révélée : coloration genre/nombre déjà posée, coloration voyelles/ajouts en attente
      [fem, masc].forEach(td=>{
        const hebEl = td.querySelector('.heb');
        if(!hebEl || processed.has(hebEl)) return;
        const original = hebEl.textContent.trim();
        if(!original) return;
        const raw = TEXT_OVERRIDES[original] || original;
        const mask = (hebEl===refHebEl) ? null : diffMaskMultiForm(refText, raw);
        hebEl.innerHTML = renderHebSpan(raw, mask);
        applyColorOverride(hebEl, original);
        hebEl.dataset.orig = original;
        processed.add(hebEl);
      });
    });
  });
  scopeEl.querySelectorAll('.heb, .heb-static').forEach(el=>{
    if(processed.has(el)) return;
    const original = el.textContent.trim();
    if(!original) return;
    const raw = TEXT_OVERRIDES[original] || original;
    el.innerHTML = renderHebSpan(raw, null);
    applyColorOverride(el, original);
    el.dataset.orig = original;
    processed.add(el);
  });
}

/* ---- Écoute au clic sur n'importe quel mot hébreu de l'app (délégation d'événement) ---- */
const AUDIO_CACHE = {}; // fileId -> data URL déjà récupérée depuis Drive (évite de la re-télécharger)
async function playRecordedAudio(ref, btn){
  try{
    let dataUrl = ref;
    if(typeof ref==='string' && ref.indexOf('drive:')===0){
      const fileId = ref.slice(6);
      if(AUDIO_CACHE[fileId]){
        dataUrl = AUDIO_CACHE[fileId];
      }else{
        if(btn) btn.classList.add('playing');
        const r = await gasCall('getAudio', {fileId});
        if(!r || !r.ok || !r.dataUrl){
          if(btn) btn.classList.remove('playing');
          alert("Impossible de récupérer l'enregistrement audio.");
          return;
        }
        dataUrl = r.dataUrl;
        AUDIO_CACHE[fileId] = dataUrl;
      }
    }
    const audio = new Audio(dataUrl);
    if(btn){ btn.classList.add('playing'); audio.onended=()=>btn.classList.remove('playing'); audio.onerror=()=>btn.classList.remove('playing'); }
    audio.play();
  }catch(e){ console.error(e); if(btn) btn.classList.remove('playing'); }
}

function simpleHash(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (Math.imul(31,h) + s.charCodeAt(i))|0; }
  return 'h'+(h>>>0).toString(16);
}
function roleLabel(r){ return r==='admin' ? 'Super administrateur' : (r==='teacher' ? 'Enseignant' : 'Élève'); }

/* ---- Synchronisation Google Sheets (backend Apps Script) ---- */
/* URL par défaut : figée en dur pour que la synchronisation fonctionne
   automatiquement même si le stockage local du navigateur/artefact est
   réinitialisé (ce qui arrive à chaque mise à jour de l'application) —
   c'est ce qui garantit que les comptes créés ne disparaissent plus. */
const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbx1WHJRQudbNcMw5CBKT7mVfAg9sZVIDaG5OU8XIoPUsxj2dsirOx1xocILNCInn15kVA/exec";
function gasUrl(){
  const stored = (localStorage.getItem('hb_gas_url')||'').trim();
  return stored || DEFAULT_GAS_URL;
}
function setGasUrl(url){ localStorage.setItem('hb_gas_url', (url||'').trim()); }
async function gasCall(action, payload){
  const url = gasUrl();
  if(!url) return null;
  try{
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action}, payload))
    });
    return await res.json();
  }catch(e){ console.error('Synchronisation Google Sheets impossible :', e); return {ok:false, error:String(e)}; }
}
async function testGasConnection(){
  const msg = document.getElementById('gasMsg');
  msg.style.color = 'var(--text-soft)'; msg.textContent = 'Test en cours…';
  const r = await gasCall('ping', {});
  if(r && r.ok){ msg.style.color='var(--green)'; msg.textContent = 'Connexion réussie ✓ — les données se synchronisent sur votre Google Sheet.'; }
  else{ msg.style.color='var(--red)'; msg.textContent = "Connexion impossible. Vérifiez l'URL et le déploiement du script (voir instructions)."; }
}
async function loadBackupsList(){
  const box = document.getElementById('backupsList');
  box.innerHTML = '<p class="ui" style="font-size:13px;color:var(--text-soft);">Chargement…</p>';
  const r = await gasCall('listBackups', {});
  if(!r || !r.ok || !r.dates || !r.dates.length){
    box.innerHTML = '<p class="ui" style="font-size:13px;color:var(--text-soft);">Aucune sauvegarde disponible pour l\'instant (la première apparaîtra après la prochaine sauvegarde automatique nocturne, ou une fois le déclencheur activé — voir instructions).</p>';
    return;
  }
  box.innerHTML = r.dates.map(d=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--parchment2);">
      <span style="font-family:'Inter',sans-serif;font-size:13.5px;">${d}</span>
      <button class="btn-ghost" style="padding:6px 12px;border-radius:8px;font-size:12.5px;" onclick="restoreBackupPrompt('${d}')">Restaurer cette date</button>
    </div>`).join('');
}
async function restoreBackupPrompt(date){
  const ok = confirm('Restaurer la sauvegarde du '+date+' va ÉCRASER tous les comptes et progressions actuels par ceux de cette date. Cette action est irréversible (sauf à restaurer une sauvegarde plus récente ensuite). Continuer ?');
  if(!ok) return;
  const r = await gasCall('restoreBackup', {date});
  if(r && r.ok){
    alert('Sauvegarde du '+date+' restaurée. La page va se recharger.');
    location.reload();
  }else{
    alert("Échec de la restauration. Réessayez ou vérifiez la connexion.");
  }
}

/* ---- Récupération d'un compte entièrement disparu (recherche dans les sauvegardes) ---- */
async function findLostAccount(){
  const username = (document.getElementById('lostAccountUser').value || '').trim();
  const box = document.getElementById('lostAccountResult');
  if(!username){ box.style.color='var(--red)'; box.textContent='Merci de saisir un identifiant.'; return; }
  if(USERS[username]){ box.style.color='var(--red)'; box.textContent="Ce compte existe déjà dans la liste actuelle — pas besoin de le restaurer."; return; }
  box.style.color='var(--text-soft)'; box.textContent='Recherche dans les sauvegardes…';
  const datesR = await gasCall('listBackups', {});
  if(!datesR || !datesR.ok || !datesR.dates || !datesR.dates.length){
    box.style.color='var(--red)'; box.textContent='Aucune sauvegarde disponible.'; return;
  }
  for(const date of datesR.dates){ // du plus récent au plus ancien
    const r = await gasCall('getStudentAccountBackup', {date, username});
    if(r && r.ok && r.data){
      box.style.color='var(--text-soft)';
      box.innerHTML = `Compte retrouvé dans la sauvegarde du <b>${date}</b> : <b>${r.data.name}</b> (${roleLabel(r.data.role)}).<br>
        <button class="navbtn" style="margin-top:8px;" onclick="restoreLostAccount('${username}','${date}')">Restaurer ce compte</button>`;
      return;
    }
  }
  box.style.color='var(--red)'; box.textContent="Aucune trace de ce compte dans les 90 derniers jours de sauvegarde. Vérifiez l'orthographe exacte de l'identifiant.";
}
async function restoreLostAccount(username, date){
  const box = document.getElementById('lostAccountResult');
  const r = await gasCall('restoreStudentAccount', {username, date});
  if(r && r.ok){
    await loadUsers();
    box.style.color='var(--green)';
    box.innerHTML = `Compte de <b>${username}</b> restauré ✓ (mot de passe : celui qu'il avait avant sa disparition). <button class="btn-ghost" style="margin-left:8px;" onclick="restoreLostAccountProgress('${username}','${date}')">Restaurer aussi sa progression du ${date}</button>`;
    render();
  }else{
    box.style.color='var(--red)'; box.textContent = (r && r.error) || "Échec de la restauration du compte.";
  }
}
async function restoreLostAccountProgress(username, date){
  const r = await gasCall('restoreStudentProgress', {username, date});
  const box = document.getElementById('lostAccountResult');
  if(r && r.ok){
    delete ALLPROGRESS[username];
    box.style.color='var(--green)'; box.textContent = 'Compte et progression de '+username+' restaurés depuis le '+date+' ✓';
  }else{
    box.style.color='var(--red)'; box.textContent = "Compte restauré, mais aucune progression trouvée à cette date (peut-être normal pour un compte récent).";
  }
}

/* ---- Examens tous les 5 cours ---- */
function examBlocks(){
  const blocks = [];
  for(let start=1; start<=LESSON_TITLES.length; start+=5){
    const end = Math.min(start+4, LESSON_TITLES.length);
    blocks.push({id:'exam'+(blocks.length+1), start, end, name:'Examen '+(blocks.length+1)+' (Cours '+start+' à '+end+')'});
  }
  return blocks;
}
function isLessonUnlocked(n){
  if(!SESSION || SESSION.role!=='student') return true;
  const blocks = examBlocks();
  const idx = blocks.findIndex(b=> n>=b.start && n<=b.end);
  if(idx<=0) return true;
  const prev = blocks[idx-1];
  const exres = (PROGRESS.exams||{})[prev.id];
  return !!(exres && exres.passed);
}
function shuffle(arr){ return arr.slice().sort(()=>Math.random()-0.5); }

/* ---- Questions de conjugaison pour un intervalle de cours (à partir de CONJUG) ---- */
function conjugQuestionsForRange(start, end, count){
  const items = CONJUG.filter(c=>c.course>=start && c.course<=end);
  let cells = [];
  items.forEach(item=>{
    item.tables.forEach(t=>{
      const blankCols = t.blank || [1,2];
      t.rows.forEach(r=>{
        blankCols.forEach(ci=>{
          if(r[ci]) cells.push({course:item.course, root:item.root, table:t.title, colLabel:t.headers[ci]||'', label:r[0], heb:r[ci]});
        });
      });
    });
  });
  if(!cells.length) return [];
  return shuffle(cells).slice(0, count).map(cell=>{
    const rest = cells.filter(x=>x.heb!==cell.heb);
    const distractors = shuffle(rest).slice(0,3).map(x=>x.heb);
    const options = shuffle([cell.heb].concat(distractors));
    const instruction = 'Quelle est la forme correspondante ?';
    const promptTxt = 'Racine <span class="heb" style="font-size:1em;">'+cell.root+'</span> — '+cell.table+(cell.colLabel?' ('+cell.colLabel+')':'')+' — '+cell.label;
    return {instruction, prompt:promptTxt, promptHeb:false, options, correct:cell.heb, render:o=>'<span class="heb" style="font-size:38px;">'+o+'</span>',
      explain:cell.root+', '+cell.table.toLowerCase()+' — '+cell.label+' → '+cell.heb+' (cours '+cell.course+').'};
  });
}
function buildExamQuestions(block){
  let qs = [];
  if(block.start===1){
    shuffle(alphabetRows).slice(0,3).forEach(row=>{
      const distractors = shuffle(alphabetRows.filter(r=>r[0]!==row[0])).slice(0,3).map(r=>r[1]);
      const options = shuffle([row[1]].concat(distractors));
      qs.push({prompt:'Quelle lettre correspond au nom « '+row[0]+' » ?', promptHeb:false, options, correct:row[1], render:o=>'<span class="heb" style="font-size:32px;">'+o+'</span>',
        explain:'Le nom « '+row[0]+' » correspond à la lettre '+row[1]+' (valeur numérique '+row[4]+', cours 1 — l\'alphabet).'});
    });
    shuffle(EX_TRANSLIT).slice(0,3).forEach(w=>{
      const distractors = shuffle(EX_TRANSLIT.filter(x=>x.heb!==w.heb)).slice(0,3).map(x=>x.fr);
      const options = shuffle([w.fr].concat(distractors));
      qs.push({instruction:'Que signifie ce mot ?', prompt:w.heb, promptHeb:true, options, correct:w.fr, render:o=>o,
        explain:w.heb+' se lit « '+w.tr+' » et signifie « '+w.fr+' » (cours 2 — les voyelles).'});
    });
    shuffle(EX_SHEVA).slice(0,3).forEach(w=>{
      qs.push({instruction:'Ce shéwa est-il mobile, quiescent ou composé ?', prompt:w.word, promptHeb:true, options:['mobile','quiescent','composé'], correct:w.answer, render:o=>o,
        explain:w.note+' (cours 3 — le shéwa).'});
    });
    shuffle(EX_SYLL).slice(0,3).forEach(w=>{
      qs.push({instruction:'La dernière syllabe de ce mot est-elle ouverte ou fermée ?', prompt:w.word, promptHeb:true, options:['ouverte','fermée'], correct:w.answer, render:o=>o,
        explain:w.note+' (cours 4 — la division syllabique).'});
    });
    const v5 = VOCAB.filter(v=>v.c===5);
    shuffle(v5).slice(0,3).forEach(w=>{
      const distractors = shuffle(v5.filter(x=>x.heb!==w.heb)).slice(0,3).map(x=>x.fr);
      const options = shuffle([w.fr].concat(distractors));
      qs.push({instruction:'Que signifie ce mot ?', prompt:w.heb, promptHeb:true, options, correct:w.fr, render:o=>o,
        explain:w.heb+' ('+w.tr+') signifie « '+w.fr+' » (cours 5 — vocabulaire).'});
    });
  }else{
    const conjQs = conjugQuestionsForRange(block.start, block.end, 6);
    let specialQs = [];
    if(block.start<=11 && block.end>=11) specialQs = specialQs.concat(shuffle(ETAT_CONSTRUIT_Q).slice(0,3));
    if(block.start<=12 && block.end>=12) specialQs = specialQs.concat(shuffle(SUFFIXES_Q).slice(0,3));
    const target = 14;
    const vocabCount = Math.max(4, target - conjQs.length - specialQs.length);
    const pool = VOCAB.filter(v=>v.c>=block.start && v.c<=block.end);
    shuffle(pool).slice(0,vocabCount).forEach(w=>{
      const dir = Math.random()<0.5 ? 'heb2fr' : 'fr2heb';
      const rest = pool.filter(x=>x.heb!==w.heb);
      const distractors = shuffle(rest).slice(0,3);
      const explain = w.heb+' ('+w.tr+') signifie « '+w.fr+' » (cours '+w.c+').';
      if(dir==='heb2fr'){
        const options = shuffle([w.fr].concat(distractors.map(x=>x.fr)));
        qs.push({instruction:'Traduisez ce mot en français.', prompt:w.heb, promptHeb:true, options, correct:w.fr, render:o=>o, explain});
      }else{
        const options = shuffle([w.heb].concat(distractors.map(x=>x.heb)));
        qs.push({instruction:'Quel est le mot hébreu correspondant ?', prompt:w.fr, promptHeb:false, options, correct:w.heb, render:o=>'<span class="heb" style="font-size:38px;">'+o+'</span>', explain});
      }
    });
    qs = qs.concat(conjQs, specialQs);
  }
  return shuffle(qs);
}
let EXAM = null;
function startExam(blockId){
  const block = examBlocks().find(b=>b.id===blockId);
  if(!block) return;
  EXAM = {block, items: buildExamQuestions(block), index:0, correct:0, answered:false, mistakes:[]};
  go('exam');
}
function answerExam(i){
  if(EXAM.answered) return;
  EXAM.answered = true;
  const item = EXAM.items[EXAM.index];
  const chosen = item.options[i];
  const isCorrect = chosen === item.correct;
  if(isCorrect){
    EXAM.correct++;
  }else{
    EXAM.mistakes.push({instruction:item.instruction, prompt:item.prompt, promptHeb:item.promptHeb, correct:item.correct, render:item.render, explain:item.explain});
  }
  item.options.forEach((o,j)=>{
    const el = document.getElementById('eopt'+j);
    if(!el) return;
    if(o===item.correct) el.classList.add('correct');
    else if(j===i) el.classList.add('wrong');
  });
  const msgEl = document.getElementById('exammsg');
  msgEl.innerHTML = isCorrect
    ? '✓ Correct'+(item.explain?' — <span class="ui" style="font-weight:400;">'+item.explain+'</span>':'')
    : ('✗ Réponse : '+item.correct+(item.explain?' — <span class="ui" style="font-weight:400;">'+item.explain+'</span>':''));
  setTimeout(()=>{ EXAM.index++; EXAM.answered=false; renderContentOnly(); }, 3800);
}

function markVisited(n){ PROGRESS.visited = PROGRESS.visited || {}; PROGRESS.visited[n]=true; saveProgress(); }
function recordScore(key, correct, total){
  PROGRESS.scores = PROGRESS.scores || {};
  const prev = PROGRESS.scores[key] || {best:0, attempts:0, history:[]};
  const history = (prev.history || []).concat([{date:Date.now(), correct, total}]).slice(-30);
  PROGRESS.scores[key] = {best: Math.max(prev.best, correct), attempts: prev.attempts+1, total: total, history};
  saveProgress();
}
function toggleKnown(heb, val){
  PROGRESS.vocabKnown = PROGRESS.vocabKnown || {};
  PROGRESS.vocabKnown[heb]=val;
  saveProgress();
  render();
}

  missing.forEach(u=>{ if(!ALLPROGRESS[u]) ALLPROGRESS[u] = {visited:{}, vocabKnown:{}, scores:{}, exams:{}}; });

/* ---- Quiz vocabulaire (QCM auto-corrigé) ---- */
let QUIZ = null;
function startVocabQuiz(filterCourse){
  let pool = filterCourse ? VOCAB.filter(v=>v.c===filterCourse) : VOCAB.slice();
  pool = pool.slice().sort(()=>Math.random()-0.5).slice(0, Math.min(10, pool.length));
  QUIZ = {
    filterCourse: filterCourse||null,
    items: pool.map(v=>{
      const dir = Math.random()<0.5 ? 'heb2fr' : 'fr2heb';
      const rest = (filterCourse?VOCAB.filter(x=>x.c===filterCourse):VOCAB).filter(x=>x.heb!==v.heb);
      const distractors = rest.slice().sort(()=>Math.random()-0.5).slice(0,3);
      const options = distractors.concat([v]).sort(()=>Math.random()-0.5);
      return {correct:v, options, dir};
    }),
    index:0, correct:0, answered:false
  };
  go('vocabquiz');
}

  if(!QUIZ){

      </div>
    </div>`;
  }
  const total = QUIZ.items.length;
  if(QUIZ.index >= total){

    const pct = Math.round(QUIZ.correct/total*100);

function stripNiqqud(s){
  // Retire seulement les vraies voyelles (+ signes non phonémiques : cantillation,
  // meteg, rafé, paséq, sof-passouq) — mais GARDE le daguesh et les points chin/sin,
  // car ils changent l'identité de la consonne (ex: ש/שׂ, ב/בּ) et une confusion
  // dessus doit compter comme une vraie erreur, pas juste "presque juste".
  return Array.from(s||'').filter(ch=>{
    const cp = ch.codePointAt(0);
    if((cp>=0x05B0 && cp<=0x05BB) || cp===0x05C7) return false; // voyelles + qamats qatan
    if(cp>=0x0591 && cp<=0x05AF) return false; // cantillation (téamim)
    if(cp===0x05BD || cp===0x05BF || cp===0x05C0 || cp===0x05C3 || cp===0x05C6) return false; // meteg, rafé, paséq, sof-passouq, noun hafoukha
    return true; // lettres, daguesh, point chin/sin conservés
  }).join('');
}

function hwClear(){
  const c = document.getElementById('hwCanvas');
  if(!c) return;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
}
function setupHandwritingCanvas(){
  const c = document.getElementById('hwCanvas');
  if(!c || c.dataset.bound) return;
  c.dataset.bound = '1';
  const ctx = c.getContext('2d');
  ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1c2b28';
  let drawing = false;
  function pos(e){
    const rect = c.getBoundingClientRect();
    return {x:(e.clientX-rect.left)*(c.width/rect.width), y:(e.clientY-rect.top)*(c.height/rect.height)};
  }
  c.addEventListener('pointerdown', e=>{
    drawing = true; c.setPointerCapture(e.pointerId);
    const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);
    e.preventDefault();
  });
  c.addEventListener('pointermove', e=>{
    if(!drawing) return;
    const p = pos(e);
    ctx.lineWidth = e.pointerType==='pen' && e.pressure ? Math.max(2, e.pressure*10) : 6;
    ctx.lineTo(p.x,p.y); ctx.stroke();
    e.preventDefault();
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>c.addEventListener(ev, ()=>{ drawing=false; }));
}

  const item = st.list[st.index];
  const cfg = key==='sheva' ? ['mobile','quiescent','composé'] : ['ouverte','fermée'];
  const chosen = cfg[i];
  const isCorrect = chosen === item.answer;
  if(isCorrect) st.correct++;
  cfg.forEach((o,j)=>{
    const el = document.getElementById('mopt'+j);
    if(!el) return;
    if(o===item.answer) el.classList.add('correct');
    else if(j===i) el.classList.add('wrong');
  });
  const noteEl = document.getElementById('mcqnote');
  noteEl.style.display='block';
  noteEl.textContent = item.note;
  setTimeout(()=>{ st.index++; st.answered=false; renderContentOnly(); }, 3200);
}

/* ---- Exercices "flashcard" auto-évalués (translit / défini / traduction / nombre) ---- */
let FLASH = {translit:null, definiF:null, tradF:null, nombreF:null};
function makeFlashState(list){ return {list:list.slice().sort(()=>Math.random()-0.5), index:0, correct:0, wrong:0, revealed:false}; }

function viewFlash(kind){
  let cfg;
  if(kind==='translit') cfg = {title:"Translittération — lire à voix haute", data:EX_TRANSLIT, key:'translit',
     front:i=>`<span class="heb">${i.heb}</span>`, back:i=>`Prononciation : <b>${i.tr}</b><br>Sens : ${i.fr}`};
  else if(kind==='definiF') cfg = {title:"Mettre à la forme définie (Cours 5)", data:EX_DEFINI, key:'definiF',
     front:i=>`<span class="heb">${i.word}</span>`, back:i=>`<span class="heb" style="font-size:32px;">${i.answer}</span><div class="rule-remind">${i.note}</div>`};
  else if(kind==='tradF') cfg = {title:"Traduire en hébreu (Cours 6-7)", data:EX_TRAD, key:'tradF',
     front:i=>`${i.fr}`, back:i=>`<span class="heb" style="font-size:30px;">${i.heb}</span>`};
  else cfg = {title:"Singulier ⇄ Pluriel (Cours 9)", data:EX_NOMBRE, key:'nombreF',
     front:i=>`<span class="heb">${i.word}</span><div class="hint">${i.dir==='pl'?'Donner le pluriel':'Donner le singulier'}</div>`, back:i=>`<span class="heb" style="font-size:30px;">${i.answer}</span><div class="rule-remind">${i.note}</div>`};

  if(!FLASH[cfg.key]) FLASH[cfg.key] = makeFlashState(cfg.data);
  const st = FLASH[cfg.key];
  const total = st.list.length;
  if(st.index >= total){
    recordScore(cfg.key, st.correct, total);
    return `<div class="topline"><div><div class="eyebrow">Résultat</div><h1>${cfg.title}</h1></div></div>
    <div class="qbox" style="text-align:center;">
      <div class="statgrid" style="max-width:420px;margin:0 auto 18px;">
        <div class="statbox"><b>${st.correct}</b><span>Je savais</span></div>
        <div class="statbox"><b>${st.wrong}</b><span>À revoir</span></div>
      </div>
      <div class="flashbtns">
        <button class="btn-reveal" onclick="FLASH['${cfg.key}']=null; go('${flashRoute(kind)}')">Recommencer</button>
        <button class="btn-ghost" onclick="go('exercices')">Retour aux exercices</button>
      </div>
    </div>`;
  }
  const item = st.list[st.index];
  return `<div class="topline"><div><div class="eyebrow">${st.index+1}/${total}</div><h1>${cfg.title}</h1></div>
    <button class="navbtn" onclick="FLASH['${cfg.key}']=null; go('exercices')">Quitter</button></div>
  <div class="progressbar"><div style="width:${(st.index/total*100)}%"></div></div>
  <div class="flash">
    <div class="side">
      <div>${cfg.front(item)}</div>
      ${st.revealed ? `<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--parchment2);">${cfg.back(item)}</div>` : ''}
    </div>
    <div class="flashbtns">
      ${st.revealed ? `
        <button class="btn-good" onclick="flashMark('${cfg.key}', true,'${kind}')">✓ Je savais</button>
        <button class="btn-bad" onclick="flashMark('${cfg.key}', false,'${kind}')">✗ À revoir</button>
      ` : `<button class="btn-reveal" onclick="flashReveal('${cfg.key}')">Afficher la réponse</button>`}
    </div>
  </div>`;
}
function flashRoute(kind){
  return {translit:'extranslit', definiF:'exdefini', tradF:'extrad', nombreF:'exnombre'}[kind];
}
function flashReveal(key){ FLASH[key].revealed = true; renderContentOnly(); }
function flashMark(key, ok){
  const st = FLASH[key];
  if(ok) st.correct++; else st.wrong++;
  st.index++; st.revealed=false;
  renderContentOnly();
}

/* ---- Examens (vues élève) ---- */
function viewExamMenu(){
  const blocks = examBlocks();
  const results = PROGRESS.exams || {};
  let cards = blocks.map((b,i)=>{
    const prevOk = i===0 || (results[blocks[i-1].id] && results[blocks[i-1].id].passed);
    const res = results[b.id];
    const statusLine = res
      ? ("Dernier score : " + res.score + "/" + res.total + " — " + (res.passed ? "Réussi ✓" : "Non réussi"))
      : (prevOk ? "Pas encore tenté" : "Réussissez l'examen précédent d'abord");
    return `<div class="extile" ${prevOk?`onclick="startExam('${b.id}')"`:''} style="${prevOk?'':'opacity:.5;cursor:default;'}">
      <h4>${prevOk?'📝':'🔒'} ${b.name}</h4>
      <p>${statusLine}</p>
      <div class="go">${prevOk?'Démarrer →':''}</div>
    </div>`;
  }).join('');
  return `<div class="topline"><div><div class="eyebrow">תַּרְגִּילִים</div><h1>Examens</h1></div></div>
  <div class="card"><p>Un examen tous les 5 cours permet de débloquer la suite du parcours. Seuil de réussite : 70% de bonnes réponses.</p></div>
  <div class="exlist">${cards}</div>`;
}
function viewExam(){
  if(!EXAM) return viewExamMenu();
  const total = EXAM.items.length;
  if(EXAM.index >= total){
    const passed = (EXAM.correct/total) >= 0.7;
    const mistakes = EXAM.mistakes || [];
    PROGRESS.exams = PROGRESS.exams || {};
    const prevExam = PROGRESS.exams[EXAM.block.id] || {history:[]};
    const history = (prevExam.history || []).concat([{date:Date.now(), score:EXAM.correct, total, passed}]).slice(-30);
    PROGRESS.exams[EXAM.block.id] = {score:EXAM.correct, total, passed: passed || !!prevExam.passed, date:Date.now(), mistakes, history};
    saveProgress();
    const res = {correct:EXAM.correct, total, passed};
    EXAM = null;
    const mistakesHtml = (!passed && mistakes.length) ? `
    <div class="card">
      <h3><span class="en">Fiche de révision</span>Points à revoir avant de retenter</h3>
      <p>Voici les questions où une erreur a été commise, avec l'explication de la bonne réponse.</p>
      ${mistakes.map(m=>`
        <div class="rule">
          ${m.instruction ? '<div class="ui" style="font-size:12px;color:var(--text-soft);margin-bottom:4px;">'+m.instruction+'</div>' : ''}
          <div style="margin-bottom:6px;">${m.promptHeb ? '<span class="heb" style="font-size:36px;">'+m.prompt+'</span>' : '<b>'+m.prompt+'</b>'}
            &nbsp;→&nbsp; ${m.render ? m.render(m.correct) : m.correct}
          </div>
          <div style="font-family:'Inter',sans-serif;font-size:13px;color:var(--text-soft);">${m.explain||''}</div>
        </div>
      `).join('')}
    </div>` : '';
    return `<div class="topline"><div><div class="eyebrow">Résultat</div><h1>${res.passed?'Examen réussi 🎉':'Examen non réussi'}</h1></div></div>
    <div class="qbox" style="text-align:center;">
      <div class="statgrid" style="max-width:420px;margin:0 auto 18px;">
        <div class="statbox"><b>${res.correct}/${res.total}</b><span>Score</span></div>
        <div class="statbox"><b>${Math.round(res.correct/res.total*100)}%</b><span>${res.passed?'Réussi (≥70%)':'Non réussi'}</span></div>
      </div>
      <p style="font-family:'Inter',sans-serif;color:var(--text-soft);">${res.passed ? "Les cours suivants sont maintenant débloqués." : "Révisez les points ci-dessous puis retentez l'examen quand vous êtes prêt(e)."}</p>
      <div class="flashbtns">
        <button class="btn-reveal" onclick="go('exammenu')">Retour aux examens</button>
        <button class="btn-ghost" onclick="go('home')">Accueil</button>
      </div>
    </div>
    ${mistakesHtml}`;
  }
  const item = EXAM.items[EXAM.index];
  const optsHtml = item.options.map((o,i)=>`<button class="optbtn" id="eopt${i}" onclick="answerExam(${i})">${item.render(o)}</button>`).join('');
  return `<div class="topline"><div><div class="eyebrow">${EXAM.block.name} — Question ${EXAM.index+1}/${total}</div><h1>Examen</h1></div>
    <button class="navbtn" onclick="EXAM=null; go('exammenu')">Quitter</button></div>
  <div class="progressbar"><div style="width:${(EXAM.index/total*100)}%"></div></div>
  <div class="qbox">
    <div class="qprompt">${item.instruction ? '<div class="ui" style="font-size:13px;color:var(--text-soft);margin-bottom:8px;">'+item.instruction+'</div>' : ''}${item.promptHeb ? '<span class="heb">'+item.prompt+'</span>' : '<div class="fr">'+item.prompt+'</div>'}</div>
    <div class="optiongrid">${optsHtml}</div>
    <div class="qfoot"><span>Score actuel : ${EXAM.correct}/${EXAM.index}</span><span id="exammsg"></span></div>
  </div>`;
}

/* ---- Tableau de progression (partagé enseignant / admin) ---- */
function studentTable(students){
  const blocks = examBlocks();
  const rows = students.map(u=>{
    const p = ALLPROGRESS[u] || {visited:{}, vocabKnown:{}, exams:{}};
    const visited = Object.keys(p.visited||{}).length;
    const known = Object.values(p.vocabKnown||{}).filter(v=>v).length;
    const rec = USERS[u] || {name:u};
    const examCells = blocks.map(b=>{
      const e = (p.exams||{})[b.id];
      return `<td>${e ? (e.score+"/"+e.total+(e.passed?" ✓":" ✗")) : "—"}</td>`;
    }).join('');
    return `<tr>
      <td>${rec.name}</td><td>${u}</td>
      <td>${visited}/${LESSON_TITLES.length}</td>
      <td>${known}/${VOCAB.length}</td>
      ${examCells}
      <td>
        <button class="btn-ghost" style="border:1px solid var(--parchment2);font-size:11px;padding:5px 10px;" onclick="resetPwd('${u}')">Réinit. mdp</button>
        <button class="btn-ghost" style="border:1px solid var(--parchment2);font-size:11px;padding:5px 10px;" onclick="go('studentrecover',{recoverUser:'${u}'})">Récupérer</button>

const EXO_LABELS = {
  translit: "Translittération (Cours 2)",
  sheva: "Le shéwa (Cours 3)",
  syll: "Syllabes (Cours 4)",
  definiF: "Forme définie (Cours 5)",
  tradF: "Traduction (Cours 6-7)",
  nombreF: "Singulier / Pluriel (Cours 9)"
};
function exoLabel(key){
  if(EXO_LABELS[key]) return EXO_LABELS[key];
  if(key.indexOf('vocabQuiz')===0){
    const c = key.replace('vocabQuiz','');
    return c==='all' ? 'Quiz de vocabulaire (tous cours)' : 'Quiz de vocabulaire — Cours '+c;
  }
  return key;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function sparklineHTML(hist){
  const pts = hist.slice(-14);
  return `<div class="spark">${pts.map(h=>{
    const pct = Math.max(0, Math.min(100, Math.round(h.correct/h.total*100)));
    return `<div class="sparkbar" style="height:${Math.max(8,pct)}%;" title="${pct}%"></div>`;
  }).join('')}</div>`;
}
function historyBlockHTML(label, hist, extra){
  const sorted = hist.slice().reverse();
  const rows = sorted.slice(0,10).map(h=>{
    const pct = Math.round(h.correct/h.total*100);
    return `<tr><td>${fmtDate(h.date)}</td><td>${h.correct}/${h.total} (${pct}%)</td><td>${extra&&h.passed!==undefined ? (h.passed?'✓ réussi':'—') : ''}</td></tr>`;
  }).join('');
  return `<div class="histrow">
    <div class="histhead"><b>${label}</b>${sparklineHTML(sorted.slice().reverse())}</div>
    <table class="histtable"><tbody>${rows}</tbody></table>
  </div>`;
}
function viewHistory(){
  const scores = PROGRESS.scores || {};
  const exams = PROGRESS.exams || {};
  let html = `<div class="topline"><div><div class="eyebrow">הִתְקַדְּמוּת</div><h1>Mon évolution</h1></div></div>`;
  const examBlocksAll = examBlocks();
  const examHtml = examBlocksAll.map(b=>{
    const e = exams[b.id];
    if(!e) return '';
    const hist = e.history && e.history.length ? e.history : [{date:e.date, score:e.score, total:e.total, passed:e.passed}];
    return historyBlockHTML(b.name, hist.map(h=>({date:h.date, correct:h.score, total:h.total, passed:h.passed})), true);
  }).join('');
  if(examHtml){
    html += `<div class="card"><h3><span class="en">Examens</span>Historique des examens</h3>${examHtml}</div>`;
  }
  const exoKeys = Object.keys(scores);
  if(exoKeys.length){
    const exoHtml = exoKeys.map(k=>{
      const s = scores[k];
      const hist = s.history && s.history.length ? s.history : [{date:Date.now(), correct:s.best, total:s.total}];
      return historyBlockHTML(exoLabel(k), hist, false);
    }).join('');
    html += `<div class="card"><h3><span class="en">Exercices</span>Historique des exercices</h3>${exoHtml}</div>`;
  }
  if(!examHtml && !exoKeys.length){
    html += `<div class="card"><p>Aucun exercice ou examen tenté pour l'instant — les scores apparaîtront ici au fur et à mesure.</p></div>`;
  }
  return html;
}

let COLOR_OVERRIDES = {};
let AUDIO_OVERRIDES = {};
let TEXT_OVERRIDES = {};
let LESSON_NOTES = {};
let BLOCK_COMMENTS = {}; // clé (hash du bloc + cours) -> {payload, audience}
function isAudienceVisibleToMe(audience){
  if(!SESSION || SESSION.role!=='student') return true; // enseignants/admin voient tout, pour pouvoir gérer
  const aud = audience || 'all';
  if(aud==='all') return true;
  return aud === ('teacher:' + (SESSION.teacher||''));
}
async function loadApprovedEdits(){
  const r = await gasCall('listEdits', {filter:{status:'approved'}});
  COLOR_OVERRIDES = {}; AUDIO_OVERRIDES = {}; TEXT_OVERRIDES = {}; LESSON_NOTES = {}; BLOCK_COMMENTS = {};
  if(!r || !r.ok || !r.edits) return;
  r.edits.filter(e=>isAudienceVisibleToMe(e.audience)).forEach(e=>{
    if(e.kind==='color'){ COLOR_OVERRIDES[e.targetText] = e.payload; }
    else if(e.kind==='audio'){ AUDIO_OVERRIDES[e.targetText] = e.payload; }
    else if(e.kind==='text'){ TEXT_OVERRIDES[e.targetText] = e.payload; }
    else if(e.kind==='blockcomment'){ BLOCK_COMMENTS[e.targetText] = e.payload; }
    else if(e.kind==='note'){
      const n = parseInt(e.targetText,10);
      LESSON_NOTES[n] = LESSON_NOTES[n] || [];
      LESSON_NOTES[n].push(e.payload);
    }
  });
}

/* =========================================================================
   COURS AJOUTÉS PAR L'ADMIN (sans passer par un développeur)
   Un cours personnalisé est une liste de "blocs" (paragraphe, encadré,
   règle, exemple, tableau) + une liste de vocabulaire. On les fusionne
   avec les cours existants au démarrage : ils s'ajoutent à la suite
   (cours 26, 27…) et bénéficient automatiquement de tout le reste de
   l'app (examens, recherche vocabulaire, coloration, suggestions...).
   ========================================================================= */
let CUSTOM_LESSONS = []; // liste brute renvoyée par le serveur (pour édition/suppression dans l'éditeur)
function inlineHeb(text){ return escapeNoteHTML(text||''); }
function renderLessonBlocks(blocks){
  return (blocks||[]).map(b=>{
    if(b.type==='p') return '<p>'+inlineHeb(b.text)+'</p>';
    if(b.type==='rule') return '<div class="rule">'+inlineHeb(b.text)+'</div>';
    if(b.type==='callout'){
      const style = b.style==='warn' ? 'warn' : 'info';
      const ico = style==='warn' ? '⚠️' : '💡';
      return '<div class="callout '+style+'"><span class="ico">'+ico+'</span><span>'+inlineHeb(b.text)+'</span></div>';
    }
    if(b.type==='example') return ex(b.heb||'', b.fr||'', b.tr||'');
    if(b.type==='table'){
      const headers = b.headers||[];
      const rows = b.rows||[];
      const hebCols = (b.hebCols||[]).map(Number);
      return tableHTML(b.caption||'', headers, rows, hebCols);
    }
    return '';
  }).join('');
}
async function loadCustomLessons(){
  // Ré-appelable en sécurité : on retire d'abord les cours personnalisés
  // précédemment fusionnés, avant de les recharger à jour depuis le serveur.
  LESSON_TITLES.length = BASE_LESSON_COUNT;
  LESSONS.length = BASE_LESSON_COUNT;
  for(let i=VOCAB.length-1;i>=0;i--){ if(VOCAB[i].c > BASE_LESSON_COUNT) VOCAB.splice(i,1); }
  const r = await gasCall('listCustomLessons', {});
  CUSTOM_LESSONS = (r && r.ok && r.lessons) ? r.lessons : [];
  CUSTOM_LESSONS.forEach(lesson=>{
    LESSON_TITLES.push(lesson.title || 'Cours sans titre');
    LESSONS.push(lesson.renderedHTML || renderLessonBlocks(lesson.blocks));
    (lesson.vocab||[]).forEach(v=>{
      VOCAB.push({heb:v.heb, tr:v.tr||'', fr:v.fr||'', g:v.g||'', c: LESSON_TITLES.length});
    });
  });
}

function blobToDataURL(blob){
  return new Promise(function(resolve){
    const r = new FileReader();
    r.onloadend = ()=>resolve(r.result);
    r.readAsDataURL(blob);
  });
}
// Choisit un format réellement supporté par le navigateur (Safari/iOS ne
// supporte souvent pas 'audio/webm' — imposer ce type quand le navigateur
// enregistre en réalité dans un autre format tronque/corrompt la lecture,
// d'où le "son de clic" au lieu de l'enregistrement complet).
function pickRecorderMimeType(){
  const candidates = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/mpeg'];
  if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  for(const c of candidates){ if(MediaRecorder.isTypeSupported(c)) return c; }
  return '';
}
async function startRecording(btnId, previewId){
  const btn = document.getElementById(btnId);
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    ACTIVE_REC_CHUNKS = [];
    const mimeType = pickRecorderMimeType();
    ACTIVE_RECORDER = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
    ACTIVE_RECORDER.ondataavailable = function(e){ if(e.data && e.data.size>0) ACTIVE_REC_CHUNKS.push(e.data); };
    ACTIVE_RECORDER.onstop = async function(){
      const actualType = ACTIVE_RECORDER.mimeType || mimeType || 'audio/webm';
      const blob = new Blob(ACTIVE_REC_CHUNKS, {type: actualType});
      RECORDING_RESULT_DATA_URL = await blobToDataURL(blob);
      stream.getTracks().forEach(t=>t.stop());
      renderRecordingPreview(previewId, btnId);
    };
    // Capture par petits morceaux réguliers (au lieu d'un seul bloc final)
    // pour garantir que tout l'enregistrement — pas seulement le début —
    // est bien récupéré, même sur les navigateurs mobiles.
    ACTIVE_RECORDER.start(250);
    if(btn){
      btn.textContent = '⏺ Enregistrement… (cliquer pour arrêter)';
      btn.classList.add('recording');
      btn.onclick = stopRecording;
    }
  }catch(e){
    alert("Micro indisponible ou accès refusé : " + (e && e.message ? e.message : e));
  }
}
function stopRecording(){
  if(ACTIVE_RECORDER && ACTIVE_RECORDER.state!=='inactive'){
    if(typeof ACTIVE_RECORDER.requestData==='function'){ try{ ACTIVE_RECORDER.requestData(); }catch(e){} }
    ACTIVE_RECORDER.stop();
  }
}
function renderRecordingPreview(previewId, btnId){
  const box = document.getElementById(previewId);
  if(box){
    if(RECORDING_RESULT_DATA_URL && RECORDING_RESULT_DATA_URL.length > 8000000){
      box.innerHTML = `<p class="ui" style="font-size:12px;color:var(--red);">⚠️ Enregistrement très volumineux — préférez un clip de quelques secondes pour un envoi rapide.</p>
        <button type="button" class="btn-ghost" onclick="playRecordedAudio(RECORDING_RESULT_DATA_URL, this)">🔊 Écouter quand même</button>`;
    }else{
      box.innerHTML = RECORDING_RESULT_DATA_URL
        ? `<button type="button" class="btn-ghost" onclick="playRecordedAudio(RECORDING_RESULT_DATA_URL, this)">🔊 Écouter le nouvel enregistrement</button>`
        : '';
    }
  }
  const btn = document.getElementById(btnId);
  if(btn){
    btn.textContent = '🎙️ Réenregistrer';
    btn.classList.remove('recording');
    btn.onclick = function(){ startRecording(btnId, previewId); };
  }
}

async function submitQuickEdit(status){

  const ctx = QUICK_EDIT_MODAL_CTX;

  const jobs = [];
  const newText = (document.getElementById('qeTextInput').value || '').trim();
  if(newText && newText !== ctx.orig){
    jobs.push({targetText: ctx.orig, kind:'text', payload:newText});
  }
  const newColor = document.getElementById('qeColorInput').value;
  if(newColor && newColor !== ctx.currentColor){
    jobs.push({targetText: ctx.orig, kind:'color', payload:newColor});
  }
  if(RECORDING_RESULT_DATA_URL){
    jobs.push({targetText: ctx.orig, kind:'audio', payload: RECORDING_RESULT_DATA_URL});

  if(!jobs.length){
    msg.style.color='var(--red)'; msg.textContent='Aucune modification à enregistrer.'; return;

    msg.style.color='var(--red)'; msg.textContent="Échec de l'enregistrement — vérifiez la connexion Google Sheets.";
  }
}

async function submitBlockComment(status){
  const msg = document.getElementById('bcMsg');
  if(!RECORDING_RESULT_DATA_URL){ msg.style.color='var(--red)'; msg.textContent="Merci d'enregistrer un commentaire vocal."; return; }
  const ctx = BLOCK_COMMENT_CTX;
  if(!ctx) return;
  const audience = SESSION.role==='admin' ? readAudienceFromSelect('bcAudience') : ('teacher:' + SESSION.username);
  msg.style.color='var(--text-soft)'; msg.textContent='Enregistrement…';
  const edit = {targetText: ctx.key, kind:'blockcomment', payload: RECORDING_RESULT_DATA_URL, authorUsername:SESSION.username, authorRole:SESSION.role, status, lessonNum: ctx.lessonNum, audience};
  const r = await gasCall('saveEdit', {edit});
  if(r && r.ok){
    msg.style.color='var(--green)';
    msg.textContent = status==='approved' ? 'Publié ✓' : "Soumis pour validation par l'admin.";
    if(status==='approved'){ await loadApprovedEdits(); renderContentOnly(); }
    RECORDING_RESULT_DATA_URL = null;
    setTimeout(closeBlockCommentModal, 900);
  }else{
    msg.style.color='var(--red)'; msg.textContent="Échec de l'enregistrement.";
  }
}
async function deleteBlockComment(){
  const ctx = BLOCK_COMMENT_CTX;
  if(!ctx) return;
  const ok = confirm('Supprimer ce commentaire vocal ?');
  if(!ok) return;
  const r = await gasCall('listEdits', {filter:{kind:'blockcomment', targetText:ctx.key}});
  if(r && r.ok && r.edits && r.edits.length){
    for(const e of r.edits){ await gasCall('deleteEdit', {id:e.id}); }
  }
  await loadApprovedEdits();
  renderContentOnly();
  closeBlockCommentModal();
}

function syncDraftFromDOM(){
  if(!LESSON_DRAFT) return;
  const titleEl = document.getElementById('ldTitle');
  if(titleEl) LESSON_DRAFT.title = titleEl.value;
  LESSON_DRAFT.blocks.forEach((b,i)=>{
    if(b.type==='p' || b.type==='rule'){
      const el = document.getElementById('ldBlockText'+i);
      if(el) b.text = el.value;
    }else if(b.type==='callout'){
      const styleEl = document.getElementById('ldBlockStyle'+i);
      const textEl = document.getElementById('ldBlockText'+i);
      if(styleEl) b.style = styleEl.value;

      const frEl = document.getElementById('ldBlockFr'+i);
      const trEl = document.getElementById('ldBlockTr'+i);
      if(hebEl) b.heb = hebEl.value;
      if(frEl) b.fr = frEl.value;
      if(trEl) b.tr = trEl.value;

      const headersEl = document.getElementById('ldBlockHeaders'+i);
      const rowsEl = document.getElementById('ldBlockRows'+i);
      const hebColsEl = document.getElementById('ldBlockHebCols'+i);
      if(capEl) b.caption = capEl.value;
      if(headersEl) b.headers = headersEl.value.split(',').map(s=>s.trim()).filter(Boolean);
      if(rowsEl) b.rows = rowsEl.value.split('\n').map(l=>l.split(',').map(s=>s.trim())).filter(r=>r.length && r.some(c=>c));
      if(hebColsEl) b.hebCols = hebColsEl.value.split(',').map(s=>parseInt(s.trim(),10)).filter(n=>!isNaN(n));

/* ---- Assistant IA : PDF → brouillon structuré (nécessite une clé API Anthropic) ---- */
let PDF_EXTRACTED_TEXT = '';
let PDFJS_LOADING = null;
function ensurePdfJsLoaded(){
  if(window.pdfjsLib) return Promise.resolve();
  if(PDFJS_LOADING) return PDFJS_LOADING;
  PDFJS_LOADING = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js';
    script.onload = ()=>{
      try{
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';
        resolve();
      }catch(e){ reject(e); }
    };
    script.onerror = ()=>reject(new Error('Impossible de charger la librairie de lecture PDF (connexion internet ?).'));
    document.head.appendChild(script);
  });
  return PDFJS_LOADING;
}
async function extractPdfText(file){
  await ensurePdfJsLoaded();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data: buf}).promise;
  let text = '';
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n\n';
  }
  return text;
}
function aiAssistPanelHTML(){
  return `<p class="ui" style="font-size:12.5px;color:var(--text-soft);">Uploadez le PDF du cours : le texte en est extrait puis envoyé à l'IA (via votre clé API Anthropic) pour pré-remplir titre, blocs et vocabulaire ci-dessous. Relisez et corrigez toujours le résultat avant de publier.</p>
    <div style="margin-bottom:10px;">
      <label class="ui" style="font-size:11.5px;color:var(--text-soft);">Clé API Anthropic (enregistrée une seule fois, jamais réaffichée) :</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
        <input id="anthropicKeyInput" type="password" placeholder="sk-ant-…" style="flex:1;min-width:180px;">
        <button type="button" class="btn-ghost" onclick="saveAnthropicKeyAction()">Enregistrer la clé</button>
      </div>
      <div id="anthropicKeyMsg" class="ui" style="font-size:12px;margin-top:4px;"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <input id="lessonPdfInput" type="file" accept="application/pdf">
      <button type="button" class="btn-ghost" onclick="generateDraftFromPdf()">✨ Générer le brouillon</button>
    </div>
    <div id="aiAssistMsg" class="ui" style="font-size:12.5px;margin-top:8px;"></div>`;
}
async function saveAnthropicKeyAction(){
  const input = document.getElementById('anthropicKeyInput');
  const msg = document.getElementById('anthropicKeyMsg');
  const key = input ? input.value.trim() : '';
  if(!key){ msg.style.color='var(--red)'; msg.textContent='Merci de coller une clé API.'; return; }
  msg.style.color='var(--text-soft)'; msg.textContent='Enregistrement…';
  const r = await gasCall('setAnthropicKey', {apiKey:key});
  if(r && r.ok){ msg.style.color='var(--green)'; msg.textContent='Clé enregistrée ✓'; if(input) input.value=''; }
  else{ msg.style.color='var(--red)'; msg.textContent="Échec de l'enregistrement de la clé."; }
}
async function generateDraftFromPdf(){
  const fileInput = document.getElementById('lessonPdfInput');
  const msg = document.getElementById('aiAssistMsg');
  if(!fileInput || !fileInput.files || !fileInput.files[0]){
    msg.style.color='var(--red)'; msg.textContent='Choisissez un fichier PDF.'; return;
  }
  try{
    msg.style.color='var(--text-soft)'; msg.textContent='Extraction du texte du PDF…';
    const text = await extractPdfText(fileInput.files[0]);
    if(!text.trim()){ msg.style.color='var(--red)'; msg.textContent="Aucun texte n'a pu être extrait de ce PDF."; return; }
    msg.style.color='var(--text-soft)'; msg.textContent="Génération du brouillon par l'IA… (peut prendre quelques dizaines de secondes)";
    const r = await gasCall('generateLessonDraft', {text});
    if(!r || !r.ok || !r.draft){
      msg.style.color='var(--red)'; msg.textContent = (r && r.error) || 'Échec de la génération. Vérifiez la clé API.';
      return;
    }
    const d = r.draft;
    syncDraftFromDOM();
    LESSON_DRAFT.title = d.title || LESSON_DRAFT.title;
    LESSON_DRAFT.blocks = Array.isArray(d.blocks) ? d.blocks : LESSON_DRAFT.blocks;
    LESSON_DRAFT.vocab = Array.isArray(d.vocab) ? d.vocab : LESSON_DRAFT.vocab;
    msg.style.color='var(--green)'; msg.textContent='Brouillon généré ✓ — relisez et corrigez avant de publier.';
    renderContentOnly();
  }catch(e){
    msg.style.color='var(--red)'; msg.textContent = 'Erreur : ' + (e && e.message ? e.message : e);
  }
}
